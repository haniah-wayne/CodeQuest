name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/setup@v1
        with:
          version: 12
          runtime: node@24
          cache: true
