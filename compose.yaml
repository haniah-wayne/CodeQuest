services:
  web:
    build: .
    ports:
      - "3000:3000"
    env_file: .env
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
